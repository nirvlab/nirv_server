<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nirvRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E5B" />
      <stop offset="100%" stop-color="#EE0033" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with subtle rounded corners -->
  <rect width="64" height="64" rx="14" fill="#141719" />
  
  <!-- Subtle network connection lines -->
  <line x1="16" y1="48" x2="28" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="36" y2="48" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="48" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>

  <!-- Bold Geometric 'N' representing Network for Intelligent Research Vietnam -->
  <path d="M 16 48 L 16 16 L 24 16 L 40 40 L 40 16 L 48 16 L 48 48 L 40 48 L 24 24 L 24 48 Z" fill="url(#nirvRedGrad)" />

  <!-- Intelligent network nodes (vertices) representing AI research network -->
  <circle cx="16" cy="16" r="3.5" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="48" cy="16" r="3.5" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="24" cy="48" r="3" fill="#FFFFFF" />
  <circle cx="40" cy="48" r="3" fill="#FFFFFF" />
</svg>
